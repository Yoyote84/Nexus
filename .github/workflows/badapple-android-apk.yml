name: Build BadApple Converter APK

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/badapple-converter-android/**"
      - ".github/workflows/badapple-android-apk.yml"
  pull_request:
    paths:
      - "apps/badapple-converter-android/**"
      - ".github/workflows/badapple-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Run tests and build APK
        working-directory: apps/badapple-converter-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp apps/badapple-converter-android/app/build/outputs/apk/debug/app-debug.apk dist/badapple-converter.apk
          sha256sum dist/badapple-converter.apk > dist/badapple-converter.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: badapple-converter-apk
          path: |
            dist/badapple-converter.apk
            dist/badapple-converter.apk.sha256
          if-no-files-found: error
          retention-days: 30
