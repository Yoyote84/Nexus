name: Nexus exported narrator host inference

on:
  workflow_run:
    workflows: ["Nexus local narrator rebuild"]
    types: [completed]

permissions:
  contents: read

jobs:
  host-inference:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    name: Load and run the published Nexus narrator on host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published Nexus assets
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify published asset hashes
        run: |
          set -euo pipefail
          cd src/narrator/local_llm/assets
          sha256sum -c SHA256SUMS.txt

      - name: Build host inference smoke test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pthread \
            -DLLM_FORCE_SCALAR \
            -I tests/nexus_llm/host \
            -I src/narrator/local_llm \
            tools/model/host_inference_test.cpp \
            src/narrator/local_llm/llm.cpp \
            -o /tmp/nexus-host-inference-test

      - name: Load CRDP model, encode prompt and execute inference
        run: |
          /tmp/nexus-host-inference-test \
            src/narrator/local_llm/assets/model_lecarnet_q4.bin \
            src/narrator/local_llm/assets/tokenizer_lecarnet_ctk2.bin
